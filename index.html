<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHK プレミアムシネマ 放送予定</title>
    <style>
        :root {
            --primary-color: #002b49;
            --accent-color: #e60012;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px 10%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1 span {
            background-color: var(--accent-color);
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 3px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .last-updated {
            text-align: right;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card-header {
            background-color: #eef2f5;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--primary-color);
            border-bottom: 2px solid #ddd;
        }

        .card-body {
            padding: 15px;
        }

        .card-title {
            font-size: 1.1rem;
            margin: 0 0 10px 0;
            line-height: 1.4;
        }

        .card-desc {
            font-size: 0.85rem;
            color: #555;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: #777;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1><span>BS / BSP4K</span> NHK プレミアムシネマ</h1>
    </header>

    <div class="container">
        <div class="last-updated" id="lastUpdated">データ読込中...</div>
        <div class="grid" id="movieGrid">
            <!-- 映画一覧がここに自動挿入されます -->
        </div>
    </div>

    <footer>
        <p>※本サイトはNHK公式サイトの公開情報を基に更新されています。</p>
    </footer>

    <script>
        async function loadSchedule() {
            try {
                const response = await fetch('schedule.json?t=' + new Date().getTime());
                const data = await response.json();

                document.getElementById('lastUpdated').innerText = '最終更新: ' + data.updated_at;

                const grid = document.getElementById('movieGrid');
                grid.innerHTML = '';

                if (!data.movies || data.movies.length === 0) {
                    grid.innerHTML = '<p>現在放送予定のデータがありません。</p>';
                    return;
                }

                data.movies.forEach(movie => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-header">📅 ${movie.date}</div>
                        <div class="card-body">
                            <h2 class="card-title">${movie.title}</h2>
                            <p class="card-desc">${movie.description || '詳細情報は準備中です。'}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('データの読み込みに失敗しました:', error);
                document.getElementById('lastUpdated').innerText = 'データの読み込みに失敗しました。';
            }
        }

        loadSchedule();
    </script>
</body>
</html>
