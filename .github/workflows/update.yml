name: Auto Update NHK Cinema Schedule

on:
  schedule:
    # 毎日朝6時（JST）に実行 (UTC 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch: # 手動実行ボタンも有効化

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v3

      - name: Python環境のセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: ライブラリのインストール
        run: |
          pip install requests beautifulsoup4

      - name: データ取得スクリプトの実行
        run: |
          python update_schedule.py

      - name: 変更のコミットとプッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update schedule.json" && git push)

